services:

  postgres:
    image: postgres:16
    container_name: filter-solar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: solarpassword
      POSTGRES_DB: filter_group_solar
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend-new
    container_name: filter-solar-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DB_USER: postgres
      DB_HOST: postgres
      DB_NAME: filter_group_solar
      DB_PASSWORD: solarpassword
      DB_PORT: 5432
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: filter-solar-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
